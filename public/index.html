<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cadastro de Usuários</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="container">
    <section class="card">
      <header class="card-header">
        <span class="badge">Node.js + Prisma + PostgreSQL</span>
        <h1>Cadastro de Usuários</h1>
        <p>Preencha os dados abaixo para cadastrar um novo usuário.</p>
      </header>

      <form id="user-form" novalidate>
        <div class="form-group">
          <label for="name">Nome</label>
          <input
            type="text"
            id="name"
            name="name"
            placeholder="Ex.: Ana Silva"
            minlength="2"
            required
          />
        </div>

        <div class="form-group">
          <label for="email">E-mail</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="ana@email.com"
            required
          />
        </div>

        <div class="form-group">
          <label for="age">Idade <span>(opcional)</span></label>
          <input
            type="number"
            id="age"
            name="age"
            placeholder="25"
            min="0"
            step="1"
          />
        </div>

        <button id="submit-button" type="submit">Cadastrar usuário</button>
      </form>

      <div id="message" class="message" role="status" aria-live="polite"></div>
    </section>
  </main>

  <script src="./script.js"></script>
</body>
</html>
